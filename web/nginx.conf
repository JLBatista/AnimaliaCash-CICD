# Configuração do Nginx dentro do container da versão web
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compacta os arquivos de texto antes de enviar
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Arquivos gerados pelo Vite têm o hash no nome: podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O site é uma aplicação de página única (React Router): qualquer endereço
    # que não seja um arquivo, como /estoque ou /login, abre o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
