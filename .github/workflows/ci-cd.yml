# Pipeline de CI/CD do Animalia Cash
#
# CI (integração contínua), a cada push e pull request:
#   1. Versão web (React + Vite): instala, roda os testes automáticos e gera o site
#   2. App (Expo / React Native): checagem de tipos, lint e geração do pacote web do app
#   3. Docker: monta a imagem do site (Node gera, Nginx serve), liga o container e testa se responde
#
# CD (entrega contínua), só quando o CI passa na branch main:
#   4. Publica a imagem Docker no GitHub Container Registry (ghcr.io), sem precisar de secrets
#   5. Publica o site no Cloudflare Pages. Precisa dos secrets CLOUDFLARE_API_TOKEN e
#      CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions). Sem eles, a etapa
#      só avisa e o site gerado fica disponível para download como artefato da execução.

name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: CI · Web (testes e build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes automáticos (Vitest)
        shell: bash
        run: |
          set -o pipefail
          # Em caso de falha, o resumo vira um aviso visível na página da execução
          npm test -- --coverage --reporter=default --reporter=json --outputFile=test-results.json 2>&1 | tee test-output.log || {
            echo "::error title=Falha nos testes::$(tail -c 3000 test-output.log | tr '\n' ' ')"
            exit 1
          }

      - name: Resumo dos testes na página da execução
        if: always() && hashFiles('web/test-results.json') != ''
        run: |
          node scripts/test-summary.mjs test-results.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/test-summary.mjs test-results.json --notice

      - name: Cobertura de testes
        if: always() && hashFiles('web/coverage/coverage-summary.json') != ''
        run: |
          node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/coverage-summary.mjs coverage/coverage-summary.json --notice

      - name: Guardar o relatório de cobertura (página navegável)
        if: always() && hashFiles('web/coverage/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-cobertura
          path: web/coverage
          retention-days: 14

      - name: Gerar o site
        run: npm run build

      - name: Guardar o site gerado
        uses: actions/upload-artifact@v7
        with:
          name: site-web
          path: web/dist
          retention-days: 7

  app:
    name: CI · App (tipos, lint e bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint do Expo)
        run: npx expo lint

      - name: Gerar o pacote do app (prova que o projeto compila)
        run: npx expo export --platform web --output-dir dist-app

  docker:
    name: CI · Docker (imagem e container)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # permite publicar a imagem no GitHub Container Registry
    steps:
      - uses: actions/checkout@v7

      - name: Montar a imagem Docker (os testes rodam dentro dela)
        run: docker build -t animaliacash-web:teste ./web

      - name: Ligar o container
        run: docker run -d --name site -p 8080:80 animaliacash-web:teste

      - name: Testar o site dentro do container
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ > /dev/null && break
            sleep 1
          done
          # A página inicial e uma rota do sistema precisam devolver o app
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/estoque | grep -q '<div id="root">'
          size=$(docker image inspect animaliacash-web:teste --format '{{.Size}}')
          echo "::notice title=Docker::✅ Container no ar e respondendo · imagem com $((size / 1024 / 1024)) MB (Nginx servindo o site pronto)"

      - name: Desligar o container
        if: always()
        run: docker rm -f site || true

      - name: Publicar a imagem no GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/animaliacash-web"
          docker tag animaliacash-web:teste "$image:latest"
          docker tag animaliacash-web:teste "$image:${GITHUB_SHA::7}"
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA::7}"
          echo "::notice title=Imagem publicada::$image:latest (para rodar: docker run -p 8080:80 $image:latest)"

  deploy-web:
    name: CD · Publicar site
    needs: [web, app, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Baixar o site testado na etapa de CI
        uses: actions/download-artifact@v8
        with:
          name: site-web
          path: dist

      - name: Publicar no Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name animaliacash --branch main

      - name: Sem credenciais do Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::notice title=Deploy::Secrets do Cloudflare não configurados. O site testado está disponível como artefato 'site-web' desta execução."
          echo "Arquivos prontos para publicação:"
          ls -la dist
